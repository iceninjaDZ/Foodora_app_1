name: Build & Upload Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Upload Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Project Directory
        id: locate-project
        run: |
          if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
            echo "project_path=." >> $GITHUB_OUTPUT
            echo "Found Android project at repository root: ."
          elif [ -d "Foodora_app_1" ] && ([ -f "Foodora_app_1/build.gradle.kts" ] || [ -f "Foodora_app_1/build.gradle" ]); then
            echo "project_path=Foodora_app_1" >> $GITHUB_OUTPUT
            echo "Found Android project in Foodora_app_1 directory."
          else
            FOUND_FILE=$(find . -maxdepth 2 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
            if [ -n "$FOUND_FILE" ]; then
              DIR=$(dirname "$FOUND_FILE")
              echo "project_path=$DIR" >> $GITHUB_OUTPUT
              echo "Found Android project in: $DIR"
            else
              echo "project_path=." >> $GITHUB_OUTPUT
              echo "Falling back to repository root: ."
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Keystores & Environment
        working-directory: ${{ steps.locate-project.outputs.project_path }}
        run: |
          # 1. Restore debug.keystore from base64 if available, or generate via keytool
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from base64..."
              base64 -d debug.keystore.base64 > debug.keystore || true
            fi
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Create release keystore if missing
          if [ ! -f my-upload-key.jks ]; then
            echo "Generating upload keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Upload,O=Android,C=US"
          fi

          # 3. Ensure environment files exist for Secrets Gradle Plugin
          if [ ! -f .env.example ]; then
            touch .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Grant Execute Permission to Gradlew
        working-directory: ${{ steps.locate-project.outputs.project_path }}
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper || true
          fi
          chmod +x gradlew

      - name: Ensure Gradle Wrapper is 9.3.1
        working-directory: ${{ steps.locate-project.outputs.project_path }}
        run: |
          ./gradlew wrapper --gradle-version 9.3.1 --distribution-type bin || true
          chmod +x gradlew

      - name: Build Debug APK with Gradlew
        working-directory: ${{ steps.locate-project.outputs.project_path }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Foodora-manager-debug-apk
          path: |
            ${{ steps.locate-project.outputs.project_path }}/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
